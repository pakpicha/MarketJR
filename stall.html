<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ตลาดนัดคาร์กิล</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F1F3EF;
  --surface: #FFFFFF;
  --ink: #17241E;
  --ink-soft: #5E6B64;
  --ink-faint: #9AA49E;
  --line: #E5E9E3;
  --brand: #14603B;
  --brand-deep: #0F4C2F;
  --paid: #1E8E57;
  --owe: #C24329;
  --rain: #6B7A86;
  --settled: #2A8FA8;
  --gold: #B07A1E;
  --paid-t: #E6F1EA;
  --owe-t: #F9E7E1;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(15,50,32,.05), 0 10px 26px -20px rgba(15,50,32,.35);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--paper); color: var(--ink); font-size: 15px; line-height: 1.5;
  padding-bottom: 78px;
}
.wrap { max-width: 920px; margin: 0 auto; padding: 14px; }

/* ---- top bar ---- */
.top {
  background: linear-gradient(180deg, var(--brand) 0%, var(--brand-deep) 100%);
  color: #fff; padding: 14px 16px 15px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 30;
  border-bottom: 3px solid var(--gold);
}
.top h1 {
  font-family: 'Kanit', sans-serif; font-weight: 600; font-size: 20px; margin: 0;
  letter-spacing: .2px;
}
.top .brandsub { color: #B9D6C6; font-size: 12px; font-weight: 400; margin-top: 1px; }
.sync-dot { font-size: 12px; color: #CDE4D8; margin-top: 3px; }
.top .side { text-align: right; }
.top .side small { color: #A9CBB8; font-size: 11px; }

/* ---- tabs ---- */
.tabs {
  display: flex; position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(255,255,255,.96); backdrop-filter: blur(8px);
  border-top: 1px solid var(--line); z-index: 40; padding-bottom: env(safe-area-inset-bottom);
}
.tabs button {
  flex: 1; border: 0; background: none; padding: 10px 2px 9px;
  font-family: 'Sarabun', sans-serif; font-size: 11px; color: var(--ink-faint);
  cursor: pointer; position: relative; transition: color .15s;
}
.tabs button .ic { display: block; font-size: 20px; line-height: 1; margin-bottom: 3px; filter: grayscale(.4); transition: transform .15s; }
.tabs button.active { color: var(--brand); font-weight: 700; }
.tabs button.active .ic { filter: none; transform: translateY(-1px); }
.tabs button.active::before {
  content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 30px; height: 3px; border-radius: 0 0 3px 3px; background: var(--brand);
}

/* ---- cards ---- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
.card h2 { font-family: 'Kanit', sans-serif; font-weight: 600; font-size: 16px; margin: 0 0 12px; letter-spacing: .2px; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .8px; color: var(--ink-faint); text-transform: uppercase; margin: 0 0 8px; }

/* ---- forms ---- */
label.f { display: block; font-size: 13px; color: var(--ink-soft); margin: 10px 0 4px; font-weight: 600; }
input[type=text], input[type=tel], input[type=number], input[type=date], input[type=url], textarea, select {
  width: 100%; padding: 10px 11px; border: 1px solid #D5DBD3; border-radius: 10px;
  font-family: inherit; font-size: 15px; background: #fff; color: var(--ink); transition: border-color .15s, box-shadow .15s;
}
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(20,96,59,.12); }
textarea { resize: vertical; min-height: 46px; }
.row2 { display: flex; gap: 10px; }
.row2 > div { flex: 1; }

/* ---- buttons ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 0; border-radius: 11px; padding: 11px 15px; font-family: 'Sarabun', sans-serif;
  font-size: 15px; font-weight: 600; cursor: pointer; background: var(--brand); color: #fff;
  transition: transform .08s, filter .15s, background .15s; line-height: 1.2;
}
.btn:active { transform: translateY(1px); filter: brightness(.96); }
.btn:focus-visible { outline: 3px solid rgba(20,96,59,.35); outline-offset: 1px; }
.btn.full { width: 100%; }
.btn.sec { background: #E9EEEA; color: var(--brand); }
.btn.warn { background: var(--owe); }
.btn.ok { background: var(--paid); }
.btn.sm { padding: 7px 11px; font-size: 13px; border-radius: 9px; }
.btnrow { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

.hint { font-size: 12.5px; color: var(--ink-soft); margin-top: 8px; line-height: 1.45; }
.muted { color: var(--ink-faint); }
.pill { display: inline-block; font-size: 11.5px; padding: 2px 9px; border-radius: 20px; background: #EEF2ED; color: var(--ink-soft); font-weight: 600; vertical-align: middle; }

/* ---- month bar + stats ---- */
.mbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.mbar .mlbl { font-family: 'Kanit', sans-serif; font-size: 19px; font-weight: 700; }
.navb { border: 1px solid #D5DBD3; background: #fff; border-radius: 10px; width: 42px; height: 40px; font-size: 22px; color: var(--brand); cursor: pointer; transition: background .15s; }
.navb:active { background: #EEF2ED; }

.totrow { display: flex; gap: 10px; margin-top: 4px; }
.totbox { flex: 1; background: #FAFBF9; border: 1px solid var(--line); border-radius: 12px; padding: 11px 8px; text-align: center; }
.totbox b { display: block; font-family: 'Kanit', sans-serif; font-size: 20px; font-weight: 600; line-height: 1.15; }
.totbox small { color: var(--ink-faint); font-size: 11.5px; font-weight: 600; }

/* ---- grid ---- */
.gridwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 12px; }
table.grid { border-collapse: collapse; width: 100%; min-width: 660px; }
table.grid th, table.grid td { border: 1px solid var(--line); padding: 0; text-align: center; }
table.grid th.name, table.grid td.name {
  position: sticky; left: 0; z-index: 2; background: #fff; text-align: left;
  padding: 9px 11px; min-width: 122px; max-width: 152px; font-weight: 600;
  box-shadow: 7px 0 8px -7px rgba(15,40,30,.14);
}
table.grid thead th { background: #EEF2EC; font-size: 12px; color: var(--ink-soft); padding: 8px 5px; font-weight: 700; transition: background .12s; }
table.grid thead th.name { background: #EEF2EC; }
table.grid thead th:not(.name):hover { background: #E1EAE0; }
table.grid thead th.rainon { background: #D9E4EC; }
.sdate { display: block; font-family: 'Kanit', sans-serif; font-size: 14px; font-weight: 600; color: var(--ink); }
.slbl { display: block; font-size: 10.5px; color: var(--ink-faint); margin-top: 1px; }
.cell {
  width: 100%; height: 48px; border: 0; background: none; cursor: pointer;
  font-family: 'Sarabun', sans-serif; font-size: 12px; font-weight: 700; color: #fff; transition: filter .1s;
}
.cell:active { filter: brightness(.94); }
.st- { background: #fff; color: #CBD3CC; font-size: 16px; }
.st-paid { background: var(--paid); }
.st-owe { background: var(--owe); }
.st-rain { background: var(--rain); }
.st-settled { background: var(--settled); }
.rowsum { font-family: 'Kanit', sans-serif; font-size: 13px; color: var(--ink-soft); padding: 6px; min-width: 72px; background: #FAFBF9; font-weight: 500; }
.legend { display: flex; gap: 13px; flex-wrap: wrap; font-size: 12.5px; margin-top: 12px; color: var(--ink-soft); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 13px; height: 13px; border-radius: 4px; display: inline-block; }

/* ---- customer list ---- */
.clist .item { display: flex; align-items: center; justify-content: space-between; padding: 12px 2px; border-bottom: 1px solid var(--line); gap: 8px; }
.clist .item:last-child { border-bottom: 0; }
.clist .nm { font-weight: 600; }
.clist .sub { font-size: 12.5px; color: var(--ink-faint); margin-top: 2px; }
.clist .acts { display: flex; gap: 6px; flex-shrink: 0; }

/* ---- session editor ---- */
.sess-ed .se { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.sess-ed .se:last-child { border-bottom: 0; }
.sess-ed .se .no { width: 22px; font-family: 'Kanit', sans-serif; font-weight: 600; color: var(--ink-faint); font-size: 14px; text-align: center; }
.sess-ed .se input[type=date] { flex: 1.4; padding: 7px 8px; }
.sess-ed .se input[type=text] { flex: 1; padding: 7px 8px; }
.sess-ed .se .rn { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; white-space: nowrap; color: var(--ink-soft); }

/* ---- outstanding ---- */
.owitem { border: 1px solid var(--line); border-radius: 12px; padding: 12px 13px; margin-bottom: 10px; background: #FCFDFB; }
.owhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.owhead .nm { font-weight: 700; font-size: 15.5px; }
.owhead .amt { font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 18px; color: var(--owe); }
.owsub { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; }
.owlist { margin-top: 8px; }
.owl { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; font-size: 13.5px; border-top: 1px dashed var(--line); }
.owl:first-child { border-top: 0; }
.grand { display: flex; align-items: center; justify-content: space-between; padding: 12px 2px 0; font-family: 'Kanit', sans-serif; font-size: 17px; font-weight: 700; }
.payform { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.paymodes { display: flex; gap: 8px; margin-bottom: 8px; }
.paymodes label { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13.5px; font-weight: 600; padding: 8px; border: 1px solid #D5DBD3; border-radius: 9px; cursor: pointer; color: var(--ink-soft); }
.paymodes input[type=radio] { accent-color: var(--brand); }
.payline { display: flex; gap: 7px; }
.payline input { flex: 1; }

/* ---- roll-call sheet ---- */
.modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(12,26,19,.5); z-index: 60; display: flex; align-items: flex-end; animation: fade .18s ease; }
.modal.hide { display: none; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet { background: var(--surface); width: 100%; max-width: 920px; margin: 0 auto; border-radius: 20px 20px 0 0; max-height: 88vh; overflow-y: auto; padding: 8px 18px 22px; animation: rise .24s cubic-bezier(.2,.8,.2,1); }
@keyframes rise { from { transform: translateY(24px); } to { transform: translateY(0); } }
.sheet::before { content: ''; display: block; width: 40px; height: 4px; border-radius: 4px; background: #D7DDD5; margin: 8px auto 12px; }
.sheet-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.sheet-top b { font-family: 'Kanit', sans-serif; font-size: 18px; font-weight: 600; }
.xbtn { border: 0; background: #EEF2ED; width: 36px; height: 36px; border-radius: 50%; font-size: 16px; color: var(--ink-soft); cursor: pointer; }
.roll-row { display: flex; align-items: center; gap: 13px; padding: 13px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
.roll-row:last-of-type { border-bottom: 0; }
.roll-row .rn-name { flex: 1; font-weight: 600; font-size: 15.5px; }
.roll-row input[type=checkbox] { width: 27px; height: 27px; flex: 0 0 auto; accent-color: var(--paid); }
.sheet-bottom { position: sticky; bottom: 0; background: linear-gradient(180deg, rgba(255,255,255,0), #fff 22%); padding-top: 14px; margin-top: 4px; }
.rollcount { font-size: 13.5px; color: var(--ink-soft); margin: 6px 0 10px; }
.rollcount b { font-family: 'Kanit', sans-serif; color: var(--paid); font-size: 15px; }

.hide { display: none !important; }
.empty { text-align: center; color: var(--ink-faint); padding: 26px 10px; font-size: 14px; line-height: 1.6; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="top">
  <div>
    <h1>ตลาดนัดคาร์กิล</h1>
    <div class="sync-dot" id="syncDot">— ยังไม่ได้ซิงค์</div>
  </div>
  <div class="side"><small>บันทึกในเครื่อง<br>อัตโนมัติ</small></div>
</div>

<div class="wrap">
  <div id="view-grid"></div>
  <div id="view-cust" class="hide"></div>
  <div id="view-owe" class="hide"></div>
  <div id="view-set" class="hide"></div>
</div>

<div class="tabs">
  <button data-tab="grid" class="active" onclick="APP.tab('grid')"><span class="ic">🗓️</span>ตารางนัด</button>
  <button data-tab="cust" onclick="APP.tab('cust')"><span class="ic">👥</span>ลูกค้า</button>
  <button data-tab="owe" onclick="APP.tab('owe')"><span class="ic">📌</span>ค้างชำระ</button>
  <button data-tab="set" onclick="APP.tab('set')"><span class="ic">⚙️</span>ตั้งค่า</button>
</div>

<div id="rollModal" class="modal hide" onclick="APP.rollBackdrop(event)"></div>

<input type="file" id="fileImport" accept="application/json" class="hide">

<script>
(function () {
  'use strict';

  var LS_KEY = 'stall_chokchai_v1';
  var DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbyYYXiDrcO35b_z0vjvJM2EzGW8Pus4sqLfk6FQ0buQuVR_cAfap2Hoaqs5lPLEZSo/exec';
  var DEFAULT_DAYS = [10, 11, 20, 21, 22, 23, 24, 25];
  var THMONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

  var DB = null;
  var currentMonth = todayMonthKey();
  var activeTab = 'grid';
  var editCustId = null;
  var syncTimer = null;

  /* ---------- utils ---------- */
  function pad2(n) { n = parseInt(n, 10); return (n < 10 ? '0' : '') + n; }
  function intVal(id) {
    var el = document.getElementById(id); if (!el) return 0;
    var v = el.value; if (v === '' || v == null) return 0;
    var n = parseInt(v, 10); return isNaN(n) ? 0 : n;
  }
  function genId() { return 'c' + Date.now().toString(36) + Math.floor(Math.random() * 100000).toString(36); }
  function todayMonthKey() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }
  function esc(s) {
    if (s == null) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function baht(n) {
    n = Math.round(n || 0);
    return n.toLocaleString ? n.toLocaleString('en-US') : ('' + n);
  }
  function thaiMonthYear(key) {
    var p = key.split('-'); var y = parseInt(p[0], 10); var m = parseInt(p[1], 10);
    return THMONTHS[m - 1] + ' ' + (y + 543);
  }
  function thaiDay(dateStr) {
    if (!dateStr) return '-';
    var p = dateStr.split('-'); var m = parseInt(p[1], 10); var d = parseInt(p[2], 10);
    return d + ' ' + THMONTHS[m - 1];
  }
  function shiftMonth(key, delta) {
    var p = key.split('-'); var y = parseInt(p[0], 10); var m = parseInt(p[1], 10);
    m += delta;
    while (m < 1) { m += 12; y -= 1; }
    while (m > 12) { m -= 12; y += 1; }
    return y + '-' + pad2(m);
  }

  /* ---------- storage ---------- */
  function loadDB() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) { DB = JSON.parse(raw); }
    } catch (e) { DB = null; }
    if (!DB) { DB = {}; }
    if (!DB.customers) { DB.customers = []; }
    if (!DB.months) { DB.months = {}; }
    if (!DB.settings) { DB.settings = {}; }
    if (typeof DB.settings.key !== 'string') { DB.settings.key = 'stall_chokchai_8f3a2c'; }
    if (typeof DB.settings.scriptUrl !== 'string' || DB.settings.scriptUrl === '') { DB.settings.scriptUrl = DEFAULT_URL; }
    if (typeof DB.settings.defaultRate !== 'number') { DB.settings.defaultRate = 0; }
    if (typeof DB.settings.autoSync !== 'boolean') { DB.settings.autoSync = false; }
  }
  function saveDB() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch (e) { alert('บันทึกไม่สำเร็จ: พื้นที่จัดเก็บเต็มหรือถูกปิด'); }
    scheduleAutoSync();
  }

  /* ---------- domain ---------- */
  function ensureMonth(key) {
    if (!DB.months[key]) {
      var sessions = [];
      for (var i = 0; i < 8; i++) {
        sessions.push({ id: 's' + (i + 1), label: '', date: key + '-' + pad2(DEFAULT_DAYS[i]), rain: false });
      }
      DB.months[key] = { sessions: sessions, cells: {} };
    }
    return DB.months[key];
  }
  function getCust(id) {
    for (var i = 0; i < DB.customers.length; i++) { if (DB.customers[i].id === id) return DB.customers[i]; }
    return null;
  }
  function custRate(id) {
    var c = getCust(id);
    if (c && typeof c.rate === 'number' && c.rate > 0) return c.rate;
    return DB.settings.defaultRate || 0;
  }
  function getCell(mo, custId, sessId) {
    if (!mo.cells[custId]) return '';
    return mo.cells[custId][sessId] || '';
  }
  function setCell(mo, custId, sessId, st) {
    if (!mo.cells[custId]) { mo.cells[custId] = {}; }
    if (st === '') { delete mo.cells[custId][sessId]; }
    else { mo.cells[custId][sessId] = st; }
  }
  function nextStatus(s) {
    if (s === 'paid') return 'owe';
    if (s === 'owe') return 'rain';
    if (s === 'rain') return '';
    if (s === 'settled') return 'paid';
    return 'paid';
  }
  function statusThai(s) {
    if (s === 'paid') return 'จ่ายแล้ว';
    if (s === 'owe') return 'ค้าง';
    if (s === 'rain') return 'ฝน (ยกให้)';
    if (s === 'settled') return 'จ่ายค้างแล้ว';
    return '';
  }
  function cellText(s) {
    if (s === 'paid') return 'มา';
    if (s === 'owe') return 'ค้าง';
    if (s === 'rain') return 'ฝน';
    if (s === 'settled') return 'จ่าย\nค้าง';
    return '·';
  }

  function outstandingFor(custId) {
    var total = 0, items = [], rate = custRate(custId);
    var c = getCust(custId);
    var opening = c && c.openingOwe ? c.openingOwe : 0;
    total += opening;
    if (opening > 0) { items.push({ type: 'opening', amount: opening }); }
    else if (opening < 0) { items.push({ type: 'credit', amount: -opening }); }
    var keys = monthKeysSorted();
    for (var k = 0; k < keys.length; k++) {
      var mk = keys[k]; var mo = DB.months[mk];
      var cells = mo.cells[custId]; if (!cells) continue;
      for (var si = 0; si < mo.sessions.length; si++) {
        var s = mo.sessions[si];
        if (cells[s.id] === 'owe') {
          total += rate;
          items.push({ type: 'cell', month: mk, sessId: s.id, date: s.date, label: s.label, amount: rate });
        }
      }
    }
    return { total: total, items: items };
  }
  function oweCellsSorted(custId) {
    var arr = [], keys = monthKeysSorted();
    for (var k = 0; k < keys.length; k++) {
      var mk = keys[k]; var mo = DB.months[mk];
      var cells = mo.cells[custId]; if (!cells) continue;
      for (var si = 0; si < mo.sessions.length; si++) {
        var s = mo.sessions[si];
        if (cells[s.id] === 'owe') arr.push({ month: mk, sessId: s.id });
      }
    }
    return arr;
  }
  function applyPayment(custId, payBaht) {
    if (!(payBaht > 0)) return 0;
    var c = getCust(custId); if (!c) return 0;
    var rate = custRate(custId);
    var total = outstandingFor(custId).total;
    if (total <= 0) return 0;
    if (payBaht > total) payBaht = total;
    var applied = payBaht;
    // 1) ตัดค้างยกมา (บวก) ก่อน
    if (c.openingOwe > 0) {
      var use = Math.min(payBaht, c.openingOwe);
      c.openingOwe -= use; payBaht -= use;
    }
    // 2) ตัดนัดค้างเก่าสุดก่อน ทีละนัด
    var cells = oweCellsSorted(custId);
    for (var i = 0; i < cells.length && payBaht >= rate - 0.001; i++) {
      setCell(DB.months[cells[i].month], custId, cells[i].sessId, 'settled');
      payBaht -= rate;
    }
    // 3) เศษที่เหลือ (< 1 นัด) เก็บเป็นเครดิตล่วงหน้า
    if (payBaht > 0.001) { c.openingOwe = (c.openingOwe || 0) - payBaht; }
    return applied;
  }
  function monthKeysSorted() {
    var arr = [];
    for (var k in DB.months) { if (DB.months.hasOwnProperty(k)) arr.push(k); }
    arr.sort();
    return arr;
  }
  function monthTotals(mk) {
    var mo = DB.months[mk]; var collected = 0, owe = 0, waived = 0;
    for (var ci = 0; ci < DB.customers.length; ci++) {
      var c = DB.customers[ci]; var rate = custRate(c.id);
      var cells = mo.cells[c.id]; if (!cells) continue;
      for (var si = 0; si < mo.sessions.length; si++) {
        var st = cells[mo.sessions[si].id];
        if (st === 'paid' || st === 'settled') collected += rate;
        else if (st === 'owe') owe += rate;
        else if (st === 'rain') waived += rate;
      }
    }
    return { collected: collected, owe: owe, waived: waived };
  }
  function isActive(c) { return c.active !== false; }
  function hasCellsInMonth(mo, custId) {
    var cells = mo.cells[custId]; if (!cells) return false;
    for (var k in cells) { if (cells.hasOwnProperty(k) && cells[k]) return true; }
    return false;
  }
  function gridCustomers(mo) {
    var list = [];
    for (var i = 0; i < DB.customers.length; i++) {
      var c = DB.customers[i];
      if (isActive(c) || hasCellsInMonth(mo, c.id)) list.push(c);
    }
    return list;
  }
  function depositsTotal() {
    var t = 0;
    for (var i = 0; i < DB.customers.length; i++) {
      if (isActive(DB.customers[i]) && DB.customers[i].deposit) t += DB.customers[i].deposit;
    }
    return t;
  }

  function fmtTime(iso) {
    try {
      var d = new Date(iso);
      return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    } catch (e) { return iso; }
  }
  function setSyncStatus(msg) {
    var el = document.getElementById('syncStatus'); if (el) el.textContent = msg;
    var dot = document.getElementById('syncDot'); if (dot) dot.textContent = msg;
  }

  /* ---------- sync ---------- */
  function buildPayload() {
    var records = [], keys = monthKeysSorted();
    for (var k = 0; k < keys.length; k++) {
      var mk = keys[k]; var mo = DB.months[mk];
      for (var ci = 0; ci < DB.customers.length; ci++) {
        var c = DB.customers[ci]; var cells = mo.cells[c.id]; if (!cells) continue;
        for (var si = 0; si < mo.sessions.length; si++) {
          var sObj = mo.sessions[si]; var st = cells[sObj.id];
          if (!st) continue;
          records.push({
            month: mk,
            monthLabel: thaiMonthYear(mk),
            date: sObj.date,
            customer: c.name,
            session: sObj.label || thaiDay(sObj.date),
            status: statusThai(st),
            amount: (st === 'paid' || st === 'settled' || st === 'owe') ? custRate(c.id) : 0
          });
        }
      }
    }
    var outs = [];
    for (var i = 0; i < DB.customers.length; i++) {
      var o = outstandingFor(DB.customers[i].id);
      if (o.total > 0) outs.push({ customer: DB.customers[i].name, total: o.total, count: o.items.length });
    }
    var custs = [];
    for (var m = 0; m < DB.customers.length; m++) {
      var cc = DB.customers[m];
      custs.push({
        name: cc.name,
        status: isActive(cc) ? 'เช่าอยู่' : 'เลิกเช่า',
        phone: cc.phone || '',
        rate: cc.rate || DB.settings.defaultRate || 0,
        deposit: cc.deposit || 0,
        openingOwe: cc.openingOwe || 0,
        note: cc.note || ''
      });
    }
    return { key: DB.settings.key, customers: custs, records: records, outstanding: outs, raw: JSON.stringify(DB) };
  }

  function syncUp() {
    var url = DB.settings.scriptUrl;
    if (!url) { setSyncStatus('ยังไม่ได้ใส่ URL'); alert('ใส่ Apps Script URL ก่อนครับ'); return; }
    setSyncStatus('กำลังซิงค์...');
    var body = JSON.stringify(buildPayload());
    fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && data.ok) {
          DB.settings.lastSync = new Date().toISOString();
          try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch (e) {}
          setSyncStatus('✅ ซิงค์สำเร็จ ' + fmtTime(DB.settings.lastSync) + ' (เขียน ' + (data.rows != null ? data.rows : '-') + ' แถว)');
        } else {
          setSyncStatus('❌ ' + (data && data.error ? data.error : 'ตอบกลับผิดพลาด'));
        }
      })
      .catch(function (err) {
        setSyncStatus('❌ ต่อไม่ได้: ' + err.message + ' — เช็คว่า Deploy เป็น “ทุกคน (Anyone)” และ URL ลงท้าย /exec');
      });
  }

  function pullDown() {
    var url = DB.settings.scriptUrl;
    if (!url) { alert('ใส่ URL ก่อนครับ'); return; }
    if (!confirm('ดึงข้อมูลจาก Sheet มาทับข้อมูลในเครื่อง? (ควรสำรองก่อน)')) return;
    setSyncStatus('กำลังดึง...');
    var u = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'key=' + encodeURIComponent(DB.settings.key);
    fetch(u, { method: 'GET' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && data.ok && data.raw) {
          var incoming = JSON.parse(data.raw);
          DB = incoming; loadDB(); saveDB();
          renderAll();
          setSyncStatus('✅ ดึงข้อมูลจาก Sheet สำเร็จ');
        } else {
          setSyncStatus('❌ ไม่มีข้อมูลใน Sheet หรือ key ไม่ตรง');
        }
      })
      .catch(function (err) { setSyncStatus('❌ ดึงไม่ได้: ' + err.message); });
  }

  function scheduleAutoSync() {
    if (!DB || !DB.settings.autoSync || !DB.settings.scriptUrl) return;
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(function () { syncUp(); }, 4000);
  }

  /* ---------- roll-call (per-session tick) ---------- */
  function sessById(mo, sessId) {
    for (var i = 0; i < mo.sessions.length; i++) { if (mo.sessions[i].id === sessId) return mo.sessions[i]; }
    return null;
  }
  function rollRowsHtml(mo, sessId) {
    var gc = gridCustomers(mo), h = '', came = 0;
    for (var i = 0; i < gc.length; i++) {
      var c = gc[i], st = getCell(mo, c.id, sessId);
      var checked = (st === 'paid') ? 'checked' : '';
      if (st === 'paid') came++;
      var tag = '';
      if (st === 'owe') tag = '<span class="pill" style="background:#fbe4e4;color:#b23b3b">ค้าง</span>';
      else if (st === 'rain') tag = '<span class="pill" style="background:#e7edf3;color:#5a6572">ฝน</span>';
      else if (st === 'settled') tag = '<span class="pill" style="background:#dbeef4;color:#2f8fb0">จ่ายค้าง</span>';
      else if (st === 'paid') tag = '<span class="pill" style="background:#e4f0e9;color:#1f7a4d">มา</span>';
      h += '<label class="roll-row"><input type="checkbox" ' + checked + ' onchange="APP.rollTick(\'' + sessId + '\',\'' + c.id + '\',this.checked)"><span class="rn-name">' + esc(c.name) + '</span>' + tag + '</label>';
    }
    return { html: h, came: came, total: gc.length };
  }
  function renderRoll(sessId) {
    var mo = ensureMonth(currentMonth), s = sessById(mo, sessId);
    if (!s) return;
    var h = '<div class="sheet">';
    h += '<div class="sheet-top"><b>เช็คชื่อ · ' + thaiDay(s.date) + '</b><button class="xbtn" onclick="APP.closeRoll()">✕</button></div>';
    h += '<label class="rn" style="display:flex;gap:7px;align-items:center;margin:4px 0 8px"><input type="checkbox" ' + (s.rain ? 'checked' : '') + ' onchange="APP.rollRain(\'' + sessId + '\',this.checked)"> 🌧️ ฝนตก — ยกทั้งนัดให้ทุกคน</label>';
    if (s.rain) {
      h += '<div class="empty">นัดนี้เป็น “ฝน” ยกให้ทุกคนแล้ว 🌧️</div>';
    } else {
      var r = rollRowsHtml(mo, sessId);
      h += '<div class="rollcount">ติ๊ก = มา · มาแล้ว <b>' + r.came + '</b> / ' + r.total + ' คน</div>';
      h += '<div class="btnrow" style="margin:0 0 4px"><button class="btn ok sm" onclick="APP.rollAll(\'' + sessId + '\',\'paid\')">✓ มาทั้งหมด</button><button class="btn sec sm" onclick="APP.rollAll(\'' + sessId + '\',\'\')">ล้าง</button></div>';
      h += '<div id="rollList">' + r.html + '</div>';
      h += '<div class="sheet-bottom"><button class="btn warn full" onclick="APP.rollOwe(\'' + sessId + '\')">ลงค้าง — คนที่ยังไม่ติ๊กทั้งหมด</button>';
      h += '<div class="hint" style="text-align:center;margin-top:6px">ติ๊กคนที่มา แล้วกดปุ่มนี้ให้คนที่เหลือเป็น “ค้าง” ทีเดียว</div></div>';
    }
    h += '</div>';
    var m = document.getElementById('rollModal');
    m.innerHTML = h; m.className = 'modal';
  }

  /* ---------- actions ---------- */
  var APP = {
    tab: function (name) {
      activeTab = name;
      var tabs = document.querySelectorAll('.tabs button');
      for (var i = 0; i < tabs.length; i++) {
        if (tabs[i].getAttribute('data-tab') === name) tabs[i].className = 'active';
        else tabs[i].className = '';
      }
      var ids = ['grid', 'cust', 'owe', 'set'];
      for (var j = 0; j < ids.length; j++) {
        var el = document.getElementById('view-' + ids[j]);
        if (ids[j] === name) el.className = ''; else el.className = 'hide';
      }
      if (name === 'grid') renderGrid();
      else if (name === 'cust') renderCust();
      else if (name === 'owe') renderOwe();
      else if (name === 'set') renderSet();
      window.scrollTo(0, 0);
    },
    mnav: function (delta) { currentMonth = shiftMonth(currentMonth, delta); renderGrid(); },
    cycle: function (custId, sessId) {
      var mo = ensureMonth(currentMonth);
      var st = getCell(mo, custId, sessId);
      setCell(mo, custId, sessId, nextStatus(st));
      saveDB(); renderGrid();
    },
    openRoll: function (sessId) { renderRoll(sessId); },
    closeRoll: function () {
      var m = document.getElementById('rollModal');
      m.className = 'modal hide'; m.innerHTML = '';
      renderGrid();
    },
    rollBackdrop: function (ev) {
      if (ev && ev.target && ev.target.id === 'rollModal') { APP.closeRoll(); }
    },
    rollTick: function (sessId, custId, checked) {
      var mo = ensureMonth(currentMonth);
      setCell(mo, custId, sessId, checked ? 'paid' : '');
      saveDB();
      var r = rollRowsHtml(mo, sessId);
      var list = document.getElementById('rollList'); if (list) list.innerHTML = r.html;
      var cnt = document.querySelector('.rollcount b'); if (cnt) cnt.textContent = r.came;
    },
    rollAll: function (sessId, st) {
      var mo = ensureMonth(currentMonth), gc = gridCustomers(mo);
      for (var i = 0; i < gc.length; i++) { setCell(mo, gc[i].id, sessId, st); }
      saveDB(); renderRoll(sessId);
    },
    rollOwe: function (sessId) {
      var mo = ensureMonth(currentMonth), gc = gridCustomers(mo);
      for (var i = 0; i < gc.length; i++) {
        var st = getCell(mo, gc[i].id, sessId);
        if (st === '' || st == null) setCell(mo, gc[i].id, sessId, 'owe');
      }
      saveDB(); renderRoll(sessId);
    },
    rollRain: function (sessId, on) {
      APP.setRain(sessId, on);
      renderRoll(sessId);
    },
    setSessDate: function (sessId, val) {
      var mo = ensureMonth(currentMonth);
      for (var i = 0; i < mo.sessions.length; i++) { if (mo.sessions[i].id === sessId) mo.sessions[i].date = val; }
      saveDB(); renderGrid();
    },
    setSessLabel: function (sessId, val) {
      var mo = ensureMonth(currentMonth);
      for (var i = 0; i < mo.sessions.length; i++) { if (mo.sessions[i].id === sessId) mo.sessions[i].label = val; }
      saveDB(); renderGrid();
    },
    setRain: function (sessId, on) {
      var mo = ensureMonth(currentMonth);
      for (var i = 0; i < mo.sessions.length; i++) { if (mo.sessions[i].id === sessId) mo.sessions[i].rain = on; }
      for (var ci = 0; ci < DB.customers.length; ci++) {
        var cid = DB.customers[ci].id; var cur = getCell(mo, cid, sessId);
        if (on) { setCell(mo, cid, sessId, 'rain'); }
        else if (cur === 'rain') { setCell(mo, cid, sessId, ''); }
      }
      saveDB(); renderGrid();
    },
    saveCust: function () {
      var name = (document.getElementById('cName').value || '').trim();
      if (!name) { alert('ใส่ชื่อลูกค้าก่อนครับ'); return; }
      var phone = (document.getElementById('cPhone').value || '').trim();
      var rate = intVal('cRate');
      var deposit = intVal('cDeposit');
      var opening = intVal('cOpen');
      var note = (document.getElementById('cNote').value || '').trim();
      if (editCustId) {
        var c = getCust(editCustId);
        if (c) { c.name = name; c.phone = phone; c.rate = rate; c.deposit = deposit; c.openingOwe = opening; c.note = note; }
        editCustId = null;
      } else {
        DB.customers.push({ id: genId(), name: name, phone: phone, rate: rate, deposit: deposit, openingOwe: opening, note: note, active: true });
      }
      saveDB(); renderCust();
    },
    setActive: function (id, on) {
      var c = getCust(id); if (!c) return;
      if (!on) {
        var ow = outstandingFor(id).total;
        var msg = 'ทำเป็น "เลิกเช่า" ' + c.name + ' ?\nข้อมูลและประวัติจะถูกเก็บไว้ทั้งหมด';
        if (ow > 0) msg += '\nยังค้างอยู่ ฿' + baht(ow) + ' (ยังตามเก็บได้ในแท็บค้างชำระ)';
        if (c.deposit) msg += '\nเงินประกัน ฿' + baht(c.deposit) + ' (แก้ไข/คืนได้ที่ปุ่มแก้ไข)';
        if (!confirm(msg)) return;
      }
      c.active = on ? true : false;
      saveDB(); renderCust();
    },
    editCust: function (id) { editCustId = id; renderCust(); window.scrollTo(0, 0); },
    cancelEdit: function () { editCustId = null; renderCust(); },
    delCust: function (id) {
      var c = getCust(id); if (!c) return;
      var ow = outstandingFor(id).total;
      if (ow > 0) {
        if (!confirm('⚠️ ' + c.name + ' ยังค้างอยู่ ฿' + baht(ow) + '\nถ้าลบ ข้อมูลค้างจะหายถาวร!\nแนะนำให้ใช้ "เลิกเช่า" แทนเพื่อเก็บข้อมูลค้างไว้\n\nยืนยันลบถาวรจริงหรือ?')) return;
      }
      if (!confirm('ลบ "' + c.name + '" ? ข้อมูลนัดทุกเดือนของคนนี้จะหายด้วย')) return;
      var arr = [];
      for (var i = 0; i < DB.customers.length; i++) { if (DB.customers[i].id !== id) arr.push(DB.customers[i]); }
      DB.customers = arr;
      for (var mk in DB.months) { if (DB.months.hasOwnProperty(mk)) { if (DB.months[mk].cells[id]) delete DB.months[mk].cells[id]; } }
      if (editCustId === id) editCustId = null;
      saveDB(); renderCust();
    },
    calcOpen: function () {
      var nats = intVal('cOpenNats');
      var rate = intVal('cRate') || DB.settings.defaultRate || 0;
      if (nats > 0 && rate > 0) { document.getElementById('cOpen').value = nats * rate; }
    },
    pay: function (custId) {
      var modeEl = document.querySelector('input[name="pm_' + custId + '"]:checked');
      var mode = modeEl ? modeEl.value : 'nats';
      var valEl = document.getElementById('pv_' + custId);
      var v = valEl ? parseInt(valEl.value, 10) : 0;
      if (isNaN(v) || v <= 0) { alert('ใส่จำนวนก่อนครับ'); return; }
      var rate = custRate(custId);
      var payBaht = (mode === 'baht') ? v : v * rate;
      var applied = applyPayment(custId, payBaht);
      saveDB(); renderOwe();
      setTimeout(function () { alert('รับชำระ ฿' + baht(applied) + ' เรียบร้อย'); }, 30);
    },
    settleOpening: function (custId) {
      var c = getCust(custId); if (!c || !c.openingOwe) return;
      var input = window.prompt('รับชำระ "ค้างยกมา" (บาท)\nค้างอยู่ ฿' + baht(c.openingOwe) + ' — ใส่จำนวนที่รับ', '' + c.openingOwe);
      if (input === null) return;
      var amt = parseInt(input, 10); if (isNaN(amt) || amt <= 0) return;
      c.openingOwe = Math.max(0, c.openingOwe - amt);
      saveDB(); renderOwe();
    },
    settle: function (custId, month, sessId) {
      var mo = DB.months[month]; if (!mo) return;
      setCell(mo, custId, sessId, 'settled');
      saveDB(); renderOwe();
    },
    settleAll: function (custId) {
      var o = outstandingFor(custId);
      for (var i = 0; i < o.items.length; i++) {
        var it = o.items[i];
        if (it.type === 'cell') { setCell(DB.months[it.month], custId, it.sessId, 'settled'); }
      }
      var c = getCust(custId); if (c && c.openingOwe > 0) c.openingOwe = 0;
      saveDB(); renderOwe();
    },
    saveSet: function () {
      DB.settings.scriptUrl = (document.getElementById('setUrl').value || '').trim();
      DB.settings.key = (document.getElementById('setKey').value || '').trim();
      saveDB(); setSyncStatus('บันทึกค่าแล้ว');
    },
    saveRate: function () {
      var v = parseInt(document.getElementById('setRate').value, 10); if (isNaN(v)) v = 0;
      DB.settings.defaultRate = v; saveDB(); renderSet();
    },
    toggleAuto: function (on) { DB.settings.autoSync = on; saveDB(); },
    syncUp: function () { APP.saveSet(); syncUp(); },
    pullDown: pullDown,
    exportJson: function () {
      var blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'stall-backup-' + todayMonthKey() + '.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    },
    importJson: function () { document.getElementById('fileImport').click(); },
    tabName: function () { return activeTab; }
  };
  window.APP = APP;

  document.getElementById('fileImport').addEventListener('change', function (ev) {
    var f = ev.target.files[0]; if (!f) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var obj = JSON.parse(e.target.result);
        if (!obj.customers && !obj.months) { alert('ไฟล์ไม่ถูกต้อง'); return; }
        if (!confirm('กู้คืนจากไฟล์นี้ ทับข้อมูลปัจจุบัน?')) return;
        DB = obj; loadDB(); saveDB(); renderAll(); alert('กู้คืนสำเร็จ');
      } catch (err) { alert('อ่านไฟล์ไม่ได้: ' + err.message); }
      ev.target.value = '';
    };
    reader.readAsText(f);
  });

  function renderAll() {
    if (activeTab === 'grid') renderGrid();
    else if (activeTab === 'cust') renderCust();
    else if (activeTab === 'owe') renderOwe();
    else if (activeTab === 'set') renderSet();
  }

  loadDB();
  ensureMonth(currentMonth);
  if (DB.settings.lastSync) setSyncStatus('ซิงค์ล่าสุด: ' + fmtTime(DB.settings.lastSync));
  renderGrid();
})();
</script>
</body>
</html>
